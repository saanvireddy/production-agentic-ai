[project]
name = "production-agentic-ai"
version = "1.0.0"
description = "Production-oriented Agentic RAG + SQL platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = [
  "S101",   # assert is fine in tests
  "S608",   # SQL string building is intentional and guarded in app/sql
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S311",   # random for synthetic seed data, not crypto
  "S105", "S106",  # demo defaults are overridden via env / secrets
  "SIM905", # str.split() word lists read better than long literals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs running Postgres/Redis (docker compose up)",
  "evaluation: RAG evaluation gate",
]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:'crypt' is deprecated:DeprecationWarning"]
