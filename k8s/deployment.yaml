apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api
  namespace: agentic-ai
  labels:
    app.kubernetes.io/name: agentic-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: agentic-ai
spec:
  replicas: 2  # HPA takes over from here
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: agentic-api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: agentic-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60  # let in-flight LLM calls finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: agentic-api }
      containers:
        - name: api
          image: production-agentic-ai:latest  # kind: `kind load docker-image production-agentic-ai:latest`
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: agentic-api-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: JWT_SECRET } }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: ADMIN_USERNAME } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: ADMIN_PASSWORD } }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }  # give the Service time to drop the endpoint
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
