apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-api-config
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: agentic-api, app.kubernetes.io/part-of: agentic-ai }
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis:6379/0"
  OLLAMA_URL: "http://ollama:11434"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.2:3b"
  EMBEDDING_PROVIDER: "ollama"
  EMBEDDING_MODEL: "nomic-embed-text"
  RETRIEVAL_TOP_K: "4"
  RETRIEVAL_MIN_SCORE: "0.35"
  RATE_LIMIT_PER_MINUTE: "30"
  # The bootstrap Job owns migrations/seed/ingestion; API pods only serve traffic.
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  AUTO_INGEST: "false"
  OTEL_ENABLED: "false"
  OTEL_EXPORTER_ENDPOINT: "http://otel-collector.observability:4317"
