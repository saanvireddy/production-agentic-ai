apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentic-api
  namespace: agentic-ai
  labels: { app.kubernetes.io/part-of: agentic-ai }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentic-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }       # 2 -> 4 -> 6 -> 8
    scaleDown:
      stabilizationWindowSeconds: 300                      # avoid flapping
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
