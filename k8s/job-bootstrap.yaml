# One-shot: schema migration, seed data, document ingestion (idempotent; safe to re-run).
#   kubectl -n agentic-ai delete job agentic-bootstrap --ignore-not-found && kubectl apply -f k8s/job-bootstrap.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-bootstrap
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: agentic-bootstrap, app.kubernetes.io/part-of: agentic-ai }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentic-bootstrap, app.kubernetes.io/part-of: agentic-ai }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: production-agentic-ai:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.database.bootstrap"]
          envFrom:
            - configMapRef: { name: agentic-api-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: DATABASE_URL } }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: ADMIN_USERNAME } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: ADMIN_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentic-api-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
