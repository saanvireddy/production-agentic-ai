# Local LLM server inside the cluster. On a laptop cluster you can instead point
# OLLAMA_URL at Ollama running natively on the host (faster on macOS - Metal GPU).
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: agentic-ai }
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: agentic-ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: agentic-ai }
spec:
  replicas: 1
  strategy: { type: Recreate }  # RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: agentic-ai }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi }
          lifecycle:
            postStart:
              exec:
                # Pull models in the background on first start; cached on the PVC afterwards.
                command: ["sh", "-c", "(sleep 5; ollama pull nomic-embed-text; ollama pull llama3.2:3b) >/tmp/pull.log 2>&1 &"]
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
