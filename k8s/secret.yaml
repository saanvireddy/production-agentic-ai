# EXAMPLE ONLY - placeholder values. Do not commit real secrets.
# Create the real secret out-of-band instead:
#
#   kubectl -n agentic-ai create secret generic agentic-api-secrets \
#     --from-literal=JWT_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgresql://agentic:...@postgres:5432/agentic'
#
# In AWS, the Helm chart can sync these from AWS Secrets Manager via External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: agentic-api-secrets
  namespace: agentic-ai
  labels: { app.kubernetes.io/part-of: agentic-ai }
type: Opaque
stringData:
  JWT_SECRET: "CHANGE-ME-generate-a-long-random-value"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE-ME"
  POSTGRES_USER: "agentic"
  POSTGRES_PASSWORD: "CHANGE-ME"
  POSTGRES_DB: "agentic"
  DATABASE_URL: "postgresql://agentic:CHANGE-ME@postgres:5432/agentic"
