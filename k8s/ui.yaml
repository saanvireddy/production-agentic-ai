apiVersion: v1
kind: Service
metadata:
  name: agentic-ui
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: agentic-ui, app.kubernetes.io/part-of: agentic-ai }
spec:
  selector: { app.kubernetes.io/name: agentic-ui }
  ports:
    - name: http
      port: 80
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ui
  namespace: agentic-ai
  labels: { app.kubernetes.io/name: agentic-ui, app.kubernetes.io/part-of: agentic-ai }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentic-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentic-ui, app.kubernetes.io/part-of: agentic-ai }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: production-agentic-ai-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: http://agentic-api
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
