{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.fullname" . }}-api
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.apiSelector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ include "agentic.fullname" . }}-ui }
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.fullname" . }}-data
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: data
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.apiSelector" . | nindent 14 }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ include "agentic.fullname" . }}-bootstrap }
{{- end }}
