{{- if .Values.ingress.enabled }}
{{- $api := printf "%s-api" (include "agentic.fullname" .) }}
{{- $ui := printf "%s-ui" (include "agentic.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentic.fullname" . }}
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          - path: /docs
            pathType: Prefix
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          - path: /openapi.json
            pathType: ImplementationSpecific
            backend:
              service: { name: {{ $api }}, port: { name: http } }
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $ui }}, port: { name: http } }
          {{- end }}
{{- end }}
