{{- if .Values.bootstrap.enabled }}
# Runs after install and on every upgrade: migrations + seed + ingestion (idempotent, advisory-locked).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentic.fullname" . }}-bootstrap
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation  # keep the finished Job so its logs can be read; TTL cleans it up
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic.fullname" . }}-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "agentic.serviceAccountName" . }}
      securityContext:
        {{- include "agentic.podSecurityContext" . | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "agentic.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.database.bootstrap"]
          envFrom:
            - configMapRef:
                name: {{ include "agentic.fullname" . }}-config
          env:
            {{- include "agentic.env" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            {{- include "agentic.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
