apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic.fullname" . }}-config
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  REDIS_URL: {{ include "agentic.redisUrl" . | quote }}
  OLLAMA_URL: {{ include "agentic.ollamaUrl" . | quote }}
  {{- if .Values.bootstrap.enabled }}
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  AUTO_INGEST: "false"
  {{- end }}
