{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
{{- $s := .Values.secrets }}
{{- $pgHost := printf "%s-postgres" (include "agentic.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic.secretName" . }}
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (pass with --set)" $s.jwtSecret | quote }}
  ADMIN_USERNAME: {{ $s.adminUsername | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (pass with --set)" $s.adminPassword | quote }}
  POSTGRES_USER: {{ $s.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (pass with --set)" $s.postgresPassword | quote }}
  POSTGRES_DB: {{ $s.postgresDb | quote }}
  DATABASE_URL: {{ default (printf "postgresql://%s:%s@%s:5432/%s" $s.postgresUser $s.postgresPassword $pgHost $s.postgresDb) $s.databaseUrl | quote }}
{{- end }}
