{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic.fullname" . }}-ui
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic.fullname" . }}-ui
  ports:
    - name: http
      port: 80
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic.fullname" . }}-ui
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "agentic.fullname" . }}-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic.fullname" . }}-ui
  template:
    metadata:
      labels:
        {{- include "agentic.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "agentic.fullname" . }}-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: http://{{ include "agentic.fullname" . }}-api
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
{{- end }}
