name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests + evaluation gates (no external services)
        run: pytest -q --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-report, path: reports/ }

  integration:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentic" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agentic:agentic@localhost:5432/agentic
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: hash
      RETRIEVAL_MIN_SCORE: "0.1"
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
      ADMIN_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Integration tests (real Postgres/pgvector + Redis)
        run: pytest -m integration -q --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-test-report, path: reports/ }
